name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # format 2.3: from their branches until unitracker-grammar 0.15.0 and unitracker-player 0.22.0 are released
      - run: pip install "unitracker-grammar @ git+https://github.com/anarkiwi/unitracker-grammar@format-2.3" "unitracker-player @ git+https://github.com/anarkiwi/unitracker-player@format-2.3"
      - run: pip install -e ".[dev]"
      - uses: anarkiwi/pysidtracker/.github/actions/cache@v0.30.0
        with:
          key: ${{ hashFiles('tests/*.py', 'tools/shared.py') }}
          sidtrace: "true"
          tunes: tests tools/shared.py
      - run: black --check src tests tools
      - run: lint-imports
      - run: pylint src
      - run: pylint --disable=missing-function-docstring tests tools
      - run: pytest -n auto --cov=unitracker --cov-fail-under=85
