[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitracker"
version = "0.2.0"
description = "Grammar-backed GoatTracker 2, defMON, Music Assembler and SID-Wizard lifters to the generic unitracker document, and its optimiser"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
    "numpy>=1.23",
    "tqdm>=4.70.1",
    "pysidtracker>=0.57.0",
    "pydefmon>=0.17.0",
    "pygoattracker>=0.10.2",
    "pymusicassembler>=0.15.0",
    "pysidwizard>=0.6.2",
    "unitracker-grammar>=0.21.0",
    "unitracker-player>=0.30.0",
    "tiktoken>=0.14.0",
    "lark>=1.1",
    "music21>=9",
]

[project.optional-dependencies]
dev = ["black>=24", "pylint>=3", "pytest>=7", "pytest-xdist>=3", "pytest-cov>=4", "pytest-timeout>=2.4.0", "import-linter>=2.15", "pyyaml>=6", "vagrant-moses[sidorder]>=0.11.0"]

[project.urls]
Homepage = "https://github.com/anarkiwi/unitracker"

[project.scripts]
unitracker-lift = "unitracker.cli:lift_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
timeout = 1200
addopts = ["-rx"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'tools')"

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100

[tool.importlinter]
root_package = "unitracker"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["unitracker"]
layers = [
    "cli",
    "lift | optimiser",
]

[[tool.importlinter.contracts]]
name = "Acyclic siblings"
type = "acyclic_siblings"
ancestors = ["unitracker"]
