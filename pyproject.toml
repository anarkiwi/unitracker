[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitracker"
version = "0.1.0"
description = "GoatTracker 2, defMON, SID-Wizard and Music Assembler lifters to the generic unitracker document, and its optimiser"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
    "numpy>=1.23",
    "tqdm>=4.70.1",
    "pysidtracker>=0.36.0",
    "pygoattracker>=0.8.0",
    "pydefmon==0.11.0",
    "pysidwizard==0.4.1",
    "pymusicassembler==0.9.0",
    "unitracker-grammar>=0.15.0",
    "unitracker-player>=0.22.0",
    "tiktoken>=0.14.0",
    "lark>=1.1",
    "music21>=9",
]

[project.optional-dependencies]
tokenize = ["tokenizers>=0.23.3", "huggingface_hub>=2.2.0"]
learn = ["torch>=2.14", "transformers>=5.19", "zstandard>=0.25", "peft>=0.21", "llguidance>=1.9.1"]
dev = ["black>=24", "pylint>=3", "pytest>=7", "pytest-xdist>=3", "pytest-cov>=4", "zstandard>=0.25.0", "pytest-timeout>=2.2", "import-linter>=2.15", "tokenizers>=0.23.3", "huggingface_hub>=2.2.0"]

[project.urls]
Homepage = "https://github.com/anarkiwi/unitracker"

[project.scripts]
unitracker-lift = "unitracker.cli:lift_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
timeout = 1200
addopts = ["-rx"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'tools')"

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100

[tool.importlinter]
root_package = "unitracker"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["unitracker"]
layers = [
    "cli",
    "direct | optimiser",
]

[[tool.importlinter.contracts]]
name = "Acyclic siblings"
type = "acyclic_siblings"
ancestors = ["unitracker"]
