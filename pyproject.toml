[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitracker"
version = "0.1.0"
description = "A generic C64 SID tracker song format, GoatTracker 2, defMON and SID-Wizard lifters, and a generic player"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.23",
    "tqdm>=4",
    "pysidtracker @ git+https://github.com/anarkiwi/pysidtracker",
    "pygoattracker @ git+https://github.com/anarkiwi/pygoattracker",
    "pydefmon @ git+https://github.com/anarkiwi/pydefmon",
    "pysidwizard @ git+https://github.com/anarkiwi/pysidwizard",
    "z3-solver>=4.12",
    "sympy>=1.12",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["black>=24", "pylint>=3", "pytest>=7", "pytest-xdist>=3", "pytest-cov>=4", "tokenizers>=0.20"]

[project.scripts]
unitracker-lift = "unitracker.cli:lift_main"
unitracker-play = "unitracker.cli:play_main"
unitracker-modfit = "unitracker.modfit.cli:main"
unitracker-optimise = "unitracker.cli:optimise_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitracker = ["playroutines/*.yaml", "modfit/specs.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100
