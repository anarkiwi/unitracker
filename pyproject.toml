[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitracker"
version = "0.1.0"
description = "A generic C64 SID tracker song format, GoatTracker 2, defMON and SID-Wizard lifters, and a generic player"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.23",
    "tqdm>=4",
    "pysidtracker>=0.23.0",
    "jennings>=0.2.0",
    "pygoattracker>=0.7.1",
    "pydefmon>=0.10.1",
    "pysidwizard>=0.3.3",
    "unitracker-grammar>=0.3.0",
    "unitracker-player>=0.4.0",
    "z3-solver>=4.12",
    "sympy>=1.12",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["black>=24", "pylint>=3", "pytest>=7", "pytest-xdist>=3", "pytest-cov>=4", "tokenizers>=0.20", "zstandard>=0.21", "filelock>=3.12", "pytest-timeout>=2.2", "import-linter>=2.15"]

[project.urls]
Homepage = "https://github.com/anarkiwi/unitracker"

[project.scripts]
unitracker-lift = "unitracker.cli:lift_main"
unitracker-modfit = "unitracker.analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitracker = ["playroutines/*.yaml", "modfit/specs.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
timeout = 1200
addopts = ["-rx"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'tools')"

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100

[tool.importlinter]
root_package = "unitracker"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["unitracker"]
layers = [
    "cli | analysis",
    "lift",
    "optimise",
    "modfit",
    "document",
    "player",
    "playroutine",
    "cache",
]

[[tool.importlinter.contracts]]
name = "Acyclic siblings"
type = "acyclic_siblings"
ancestors = ["unitracker"]
