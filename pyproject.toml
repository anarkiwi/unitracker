[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitracker"
version = "0.1.0"
description = "A generic C64 SID tracker song format, GoatTracker 2, defMON and SID-Wizard lifters, and a generic player"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.23",
    "tqdm>=4",
    "pysidtracker>=0.20.1",
    "jennings>=0.2.0",
    "pygoattracker @ git+https://github.com/anarkiwi/pygoattracker",
    "pydefmon>=0.10.0",
    "pysidwizard @ git+https://github.com/anarkiwi/pysidwizard",
    "unitracker-grammar @ git+https://github.com/anarkiwi/unitracker-grammar",
    "unitracker-player @ git+https://github.com/anarkiwi/unitracker-player",
    "z3-solver>=4.12",
    "sympy>=1.12",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["black>=24", "pylint>=3", "pytest>=7", "pytest-xdist>=3", "pytest-cov>=4", "tokenizers>=0.20", "zstandard>=0.21", "filelock>=3.12", "pytest-timeout>=2.2"]

[project.urls]
Homepage = "https://github.com/anarkiwi/unitracker"

[project.scripts]
unitracker-lift = "unitracker.cli:lift_main"
unitracker-modfit = "unitracker.modfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitracker = ["playroutines/*.yaml", "modfit/specs.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1200
addopts = ["-rx"]

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100
