# Modulations to fit: the action list at a dotted path and the cell it modulates.
fits:
  - {playroutine: goattracker2, path: record_types.pulsetab.each, cell: pulse}
  - {playroutine: goattracker2, path: records.tickn.1.do, cell: freq}
  - {playroutine: goattracker2, path: procs.toneporta, cell: freq}
  - {playroutine: defmon, path: procs.pulse, cell: pw}
  - {playroutine: defmon, path: procs.pitch, cell: sacc}
  - {playroutine: sidwizard, path: procs.tick_porta, cell: voff}
  - {playroutine: sidwizard, path: procs.tick_vibrato, cell: vfc}
  - {playroutine: goattracker2, path: record_types.filttab.each, cell: filtercutoff}
  - {playroutine: sidwizard, path: procs.tick_pw, cell: "pwhi:pwlo"}
  - {playroutine: sidwizard, path: procs.tick_filt, cell: "vfhi:vflo:3"}
  - {playroutine: defmon, path: procs.acid, cell: acc}

# Candidates proved or refuted as given, under an optional guard.
checks:
  - playroutine: sidwizard
    path: procs.tick_porta
    cell: voff
    candidate: {accumulate: voff, step: "((fmh << 8) | fml) + 1", toward: 0, signed: true}
  - playroutine: defmon
    path: procs.acid
    cell: acc
    candidate:
      accumulate: acc
      step: "(0 - astep - 1) if sub else astep"
      max: 0x7FFF
      clamp: false
      on_bound: [{set: {acc: "512 + (acc & 255)"}}]
  - playroutine: sidwizard
    path: procs.tick_pw
    cell: "pwhi:pwlo"
    candidate: {accumulate: "pwhi:pwlo", step: "s8(pwtab[ppos].b)"}
    guard: "ci != 0 and ppos != 0 and pwtab[ppos].a < 0x80 and pwcnt < pwtab[ppos].a"

# Multi-tick orbits: ``period`` is a cell or a ``record.index.field``, swept over the
# inclusive ``periods`` range from ``state`` with record rows ``data``.
orbits:
  goattracker2:
    path: procs.vibrato
    cell: freq
    period: speedtab.1.l
    periods: [0, 127]
    state: {vibtime: 0, freq: 20000, lastnote: 40, arg: 1}
    data: {speedtab: {1: {l: 0, r: 1}}}
  sidwizard:
    path: procs.tick_vibrato
    cell: voff
    period: vper
    periods: [1, 127]
    state: {ci: 1, svib: 0x10, vdc: -1, vfc: 0, vper: 1, fml: 1, fmh: 0, voff: 0}
    data: {}

# Keyword composition: the setup template (CODE the command code, arg its argument), the tick
# lists that may follow it, the routing cells left out of reports and the row templates.
commands:
  goattracker2:
    setup:
      - set: {newcommand: CODE, newcmddata: arg}
      - {if: hasnew, then: [{call: new_note_init}]}
      - run: {record: tick0, index: CODE, field: do}
    ticks:
      - [{run: {record: tickn, index: command, field: do}}]
    routing: [newcommand, newcmddata]
    rows:
      plain: {hasnew: 0}
      note: {hasnew: 1}
  defmon:
    setup:
      - set: {ev_cmd: CODE, ev_arg: arg}
      - call: pattern
    ticks: [procs.layer_b]
    routing: [ev_cmd, ev_arg]
    rows:
      plain: {ev_kind: 0, ev_instr: 0}
      note: {ev_kind: 1}
  sidwizard:
    setup:
      - {call: route, with: {rc: CODE, ra: arg}}
      - call: apply_row
    ticks: [procs.tick_vibrato, procs.run_deferred, procs.tick_pw, procs.tick_filt, procs.tick_chord]
    routing: [pfx, pfv, pifx, pia, pnfx, rc, ra, xfc, xfv, xia, xifx, xpa, dfc, dfv, difx, dia, dpa]
    rows:
      plain: {pk: 0, pins: 0, pleg: 0, pifx: 0, pia: 0, pfx: 0, pfv: 0, pnfx: 0}
      note: {pk: 1, pleg: 0, pifx: 0, pia: 0, pfx: 0, pfv: 0, pnfx: 0}

# Bounce orbits: a cell whose hit reloads it and flips a mode cell, proved over every parameter.
bounces:
  - {playroutine: defmon, path: procs.pulse, cell: pw}

# Table programs: the record type, the list that steps it, the swept cell, the program pointer,
# the control state at a program start and the cell holding the instrument that starts it.
sweeps:
  goattracker2:
    - {record: pulsetab, path: procs.pulse_exec, cell: pulse, pointer: pptr, state: {ptime: 0}}
    - {record: filttab, path: procs.filter_exec, cell: filtercutoff, pointer: fptr, state: {ftime: 0}}
  sidwizard:
    - {record: pwtab, path: procs.tick_pw, cell: "pwhi:pwlo", pointer: ppos, state: {pwcnt: 0}, instrument: ci}
    - record: flttab
      path: procs.tick_filt
      cell: "vfhi:vflo:3"
      pointer: fpos
      state: {fsweep: 0, vi: 0, fctl: 0}
      instrument: ci

# Modulators as phase and value expressions: per playroutine the frequency table, the note
# cells read as N (less ``transpose``), tables named by their entries and functions read
# through them (proved equal on every argument byte), and the units. A unit's ``fire`` list is one firing, run between the calls
# ``pre`` and ``post``; a ``hook`` restarts it when it writes ``written``, changes ``key``, or
# writes ``pointer`` to a ``program`` whose rows set one of ``fields``.
exprs:
  goattracker2:
    freq: {word: ftab}
    notes: [note]
    units:
      - name: command
        cell: freq
        fire: [{run: {record: tickn, index: command, field: do}}]
        pre: records.tickn.do
        label: [command, cmddata]
        hooks:
          - {at: records.tick0.do, key: [command, cmddata]}
          - {at: record_types.ctrltab.do, written: [lastnote]}
      - name: pulse
        cell: pulse
        fire: [pulse_exec]
        pre: procs.pulse_exec
        label: [pptr]
        hooks:
          - {at: procs.new_note_init, written: [pptr]}
          - {at: records.tick0.do.9, written: [pptr]}
          - {at: records.wavecmd.do.9, written: [pptr]}
      - name: filter
        scope: global
        cell: filtercutoff
        fire: [filter_exec]
        pre: procs.filter_exec
        label: [fptr]
        hooks:
          - {at: procs.new_note_init, written: [fptr]}
          - {at: records.tick0.do.10, written: [fptr]}
          - {at: records.tick0.do.11, written: [fptr]}
          - {at: records.wavecmd.do.10, written: [fptr]}
          - {at: records.wavecmd.do.11, written: [fptr]}
  defmon:
    freq: {hi: note_hi, lo: note_lo}
    notes: [note, tbase]
    units:
      - name: pitch A
        cell: sacc
        fire: [layer_a, pitch]
        pre: procs.layer_a
        post: procs.pitch
        label: [rowA]
        program: {pointer: rowA, record: sidtab, fields: [af]}
        hooks: [{at: procs.pattern, written: [sacc], pointer: [rowA]}]
      - name: pulse A
        cell: pw
        fire: [layer_a, pulse]
        pre: procs.layer_a
        post: procs.pulse
        label: [rowA]
        program: {pointer: rowA, record: sidtab, fields: [pw, ps]}
        hooks: [{at: procs.pattern, pointer: [rowA]}]
      - name: acid B
        scope: global
        cell: acc
        fire: [layer_b, acid]
        pre: procs.layer_b
        post: procs.acid
        label: [rowB]
        program: {pointer: rowB, record: sidtab, fields: [acid]}
        hooks: [{at: procs.pattern, pointer: [rowB]}]
  sidwizard:
    freq: {hi: freqhi, lo: freqlo}
    notes: [note, pn]
    transpose: oct
    tables:
      W: {size: 204, entry: "exptab[i] if i < 107 else (freqhi[i - 107] << 8) | freqlo[i - 107]"}
    functions:
      fmlo: "W[fyc(a, d)] & 0xFF"
      fmhi: "W[fyc(a, d)] >> 8"
    units:
      - name: pitch
        cell: voff
        fire: [tick_vibrato]
        pre: procs.tick_vibrato
        label: [svib, pk, pfx, pfv, pnfx, pleg, ci]
        hooks:
          - {at: procs.apply_row, written: [voff], key: [svib, fml, fmh, vper]}
          - {at: procs.run_deferred, key: [svib, fml, fmh, vper]}
      - name: pulse
        cell: "pwhi:pwlo"
        fire: [tick_pw]
        pre: procs.tick_pw
        label: [ppos]
        hooks: [{at: procs.start_note, written: [ppos]}]
      - name: filter
        cell: "vfhi:vflo:3"
        mirror: "fcuthi:fcutlo:3"
        fire: [tick_filt]
        pre: procs.tick_filt
        label: [fpos]
        hooks: [{at: procs.start_note, written: [fpos]}]
