instrument: {type: sidtab, base: 1}
note_offset: 24
onset: onset
commands:
  1: {name: run2, ref: sidtab}
# A note's restart runs its lookahead rows as one sidTAB program on layer B (!run2), as many
# ticks before the note as they hold.
restart: {command: 1}
record_types:
  # The restart a note names: lookahead rows of sidTAB columns, then the note's empty row.
  restart:
    prefix: r
    none: 0
    chain: next
    form: map
    fields: {dl: 0, wgh: -1, wgl: -1, ad: -1, sr: -1, next: 0}
    codec:
      - when: "not last and dl >= 0 and dl < 0x80"
        keys:
          hold: {value: "dl + 1", omit: "dl == 0"}
          ctrl: {value: wgh, omit: "wgh < 0"}
          ad: {value: ad, omit: "ad < 0"}
          sr: {value: sr, omit: "sr < 0"}
        keep: [wgl]
        raw:
          dl: "(hold - 1) if has_hold else 0"
          wgh: "ctrl if has_ctrl else -1"
          ad: "ad if has_ad else -1"
          sr: "sr if has_sr else -1"
      - when: "last and dl == 0 and wgh < 0 and wgl < 0 and ad < 0 and sr < 0"
  # sidTAB row: dl holds the row dl + 1 ticks ($80+ freezes the layer); each column, -1 when
  # absent, applies in the replay's bitmap-walk order ($16B0).
  sidtab:
    prefix: t
    chain: next
    stop: "dl >= 0x80"
    form: map
    # freq, pw and cut are the row's pitch, pulse and ACID modulator expressions (xf, xp, xc):
    # a pitch expression runs the slide mode (af $80), a pw or cut expression replaces the
    # pw, ps and acid columns. af below $80 is a fixed offset, kept as a column. re edits $D417
    # for the row's voice: 0 unroutes it (route -), bit 3 keeps the routing and adds the voice and
    # the low nibble under resonance re >> 4 (route + m), any other value is the byte (res, route).
    codec:
      - when: "xf != 0 and af == 0x80 and pw < 0 and ps < 0 and acid < 0"
        keys:
          <<: &columns
            hold: {value: "dl + 1", omit: "dl == 0 or dl >= 0x80"}
            ctrl: {value: wgh, omit: "wgh < 0"}
            note: {value: "(tr & 0x7F) if tr >= 0x80 else ((tr - 0x80) if tr >= 0x40 else tr)", abs: "tr >= 0x80", omit: "tr < 0"}
            ad: {value: ad, omit: "ad < 0"}
            sr: {value: sr, omit: "sr < 0"}
            pw: {expr: xp}
            cut: {expr: xc}
            res: {value: "re >> 4", omit: "re <= 0"}
            route: {value: "re & 0x0F", rel: "-1 if re == 0 else (1 if re & 0x08 else 0)", omit: "re < 0"}
            mode: {value: "fv & 0xF0", omit: "fv < 0"}
          freq: {expr: xf}
        keep: [wgl, cp]
        raw:
          <<: &fields
            dl: "(hold - 1) if has_hold else 0"
            wgh: "ctrl if has_ctrl else -1"
            tr: "(((note & 0x7F) | 0x80) if note_abs else (note & 0x7F)) if has_note else -1"
            ad: "ad if has_ad else -1"
            sr: "sr if has_sr else -1"
            re: "-1 if not has_route else (0 if route_rel < 0 else ((res & 0x0F) << 4) | (route & 0x0F))"
            fv: "mode if has_mode else -1"
          af: 0x80
      - when: "xf == 0 and af < 0x80 and pw < 0 and ps < 0 and acid < 0"
        keys: *columns
        keep: [wgl, af, cp]
        raw: *fields
    # A frozen row ends a program.
    end: {dl: 0x80}
    fields: {dl: 0, wgh: -1, wgl: -1, ad: -1, sr: -1, tr: -1, af: -1, pw: -1, ps: -1, re: -1, fv: -1, cp: -1, acid: -1, next: 0, xf: 0, xp: 0, xc: 0}
    refs: {xf: x, xp: x, xc: x}
    do:
      - {if: "row.wgh >= 0", then: [{set: {ctrl: row.wgh}}]}
      - {if: "row.wgl >= 0", then: [{set: {eor: row.wgl}}]}
      - {if: "row.ad >= 0", then: [{set: {ad: row.ad}}]}
      - {if: "row.sr >= 0", then: [{set: {sr: row.sr}}]}
      - if: "row.tr >= 0"
        then: [{set: {note: "(row.tr & 0x7F) if row.tr & 0x80 else ((tbase + row.tr) & 0x7F)"}}]
      - {if: "row.af >= 0", then: [{set: {mode: row.af}}]}
      - {if: "row.pw >= 0", then: [{set: {pw: "(row.pw << 8) | (row.pw & 0xF0)"}}]}
      - {if: "row.ps >= 0", then: [{set: {ps: row.ps}}]}
      - if: "row.re >= 0"
        then:
          - set:
              res: "(res & rmask) if row.re == 0 else (((res & 0x0F) | row.re | rbit) if row.re & 0x08 else row.re)"
      - {if: "row.fv >= 0", then: [{set: {fv: row.fv}}]}
      - {if: "row.cp >= 0", then: [{set: {cp: row.cp}}]}
      - if: "row.acid >= 0"
        then:
          - if: "row.acid & 0x8000"
            then:
              - if: "row.acid & 0x4000"
                then: [{set: {astep: "row.acid & 0x3FFF", sub: 1}}]
                else: [{set: {astep: "row.acid & 0x7FFF", sub: 0}}]
            else: [{set: {acc: row.acid, astep: 0}}]
  # Each voice's state as init leaves it; a layer's row is a reference while its counter runs.
  vinit:
    fixed: true
    form: map
    fields: [pw, flo, fhi, sr, ad, ctrl, wgl, sacc, af, ps, note, tbase, rowA, cntA, rowB, cntB]
    codec:
      - keys:
          ctrl: {value: ctrl, omit: "ctrl == 0"}
          note: {value: note, abs: "1", omit: "note == 0"}
          ad: {value: ad, omit: "ad == 0"}
          sr: {value: sr, omit: "sr == 0"}
          # The written width is the 12-bit cell; a cell over $0FFF has no form that reads back.
          pw: {value: "pw if pw <= 0x0FFF else pw + 0x10000", omit: "pw == 0"}
        keep: [flo, fhi, sacc, af, wgl, ps, tbase, rowA, cntA, rowB, cntB]
        raw:
          ctrl: "ctrl if has_ctrl else 0"
          note: "note if has_note else 0"
          ad: "ad if has_ad else 0"
          sr: "sr if has_sr else 0"
          pw: "pw if has_pw else 0"
    refs:
      rowA: {type: sidtab, when: "cntA < 0x80"}
      rowB: {type: sidtab, when: "cntB < 0x80"}
  ginit:
    fixed: true
    form: map
    fields: [resfilt, fv, cp, acc, astep, sub]
    codec:
      - keys:
          res: {value: "resfilt >> 4", omit: "resfilt < 0x10"}
          route: {value: "resfilt & 0x0F", omit: "(resfilt & 0x0F) == 0"}
          mode: {value: "fv & 0xF0", omit: "fv < 0x10"}
        keep: [cp, acc, astep, sub]
        raw: {resfilt: "((res & 0x0F) << 4) | (route & 0x0F)", fv: mode}
functions:
  nfreq:
    args: [n]
    expr: "note_lo[n] | (note_hi[n] << 8)"
  rate:
    args: [m]
    expr: "rate_lo[(m & 0x3F) << 1] | (rate_hi[(m & 0x3F) << 1] << 8)"
  por:
    args: [y]
    expr: "((por_lo[y + 1] | (por_hi[y + 1] << 8)) - (por_lo[y] | (por_hi[y] << 8))) & 0xFFFF"
global:
  res: {width: 8}
  fv: {width: 8}
  cp: {width: 8}
  acc: {width: 17}
  astep: {width: 16}
  sub: {width: 1}
  cf: {width: 8}
  o16: {width: 8}
  o17: {width: 8}
  o18: {width: 8}
  vi: {width: 8}
voice:
  onset: {width: 1}
  pw: {width: 16}
  flo: {width: 8}
  fhi: {width: 8}
  ad: {width: 8}
  sr: {width: 8}
  ctrl: {width: 8}
  eor: {width: 8}
  mode: {width: 8}
  sacc: {width: 16}
  ps: {width: 8}
  note: {width: 8}
  tbase: {width: 8}
  rowA: {width: 8}
  cntA: {width: 8}
  rowB: {width: 8}
  cntB: {width: 8}
  row: {width: 8}
  cnt: {width: 8}
  cur: {width: 8}
  fc: {width: 1}
  pf: {}
  detune: {width: 8}
  rbit: {width: 8}
  rmask: {width: 8}
  o_flo: {width: 8}
  o_fhi: {width: 8}
  o_pw: {width: 16}
  o_ctrl: {width: 8}
  o_ad: {width: 8}
  o_sr: {width: 8}

procs:
  # $1022 SID band: this call writes the state the previous call left.
  latch:
    - set: {o_flo: flo, o_fhi: fhi, o_pw: pw, o_ctrl: "ctrl ^ eor", o_ad: ad, o_sr: sr}
  # $10B5 ACID cutoff: CLC then ADC adds the step, or SBC adds its complement (step + 1 less);
  # bit 16 of acc is the carry, which the cutoff adds; a negative high byte saturates.
  acid_step:
    - set: {acc: "(acc & 0xFFFF) + ((0xFFFF - astep) if sub else astep)"}
    - if: "(acc & 0xFFFF) > 0x7FFF"
      then: [{set: {acc: "((acc >= 0x10000) << 16) + (floor << 8) + (acc & 0xFF)"}}]
  acid_out:
    - set: {cf: "((acc & 0xFFFF) >> 8) + cp + (acc >= 0x10000)"}
    - set: {o16: "floor if (cf >= 0x80 or cf < floor) else cf"}
    - {if: dbl, then: [{set: {o16: "o16 << 1"}}]}
  # $117F pattern event: arm the sidcall layers, latch a note.
  pattern:
    - fetch: true
    - {if: ev_instr, then: [{set: {rowA: "ev_instr - 1", cntA: 0}}]}
    - {if: ev_cmd, then: [{set: {rowB: ev_arg, cntB: 0}}]}
    - {if: "ev_kind == 1", then: [{set: {onset: 1, tbase: ev_note, note: ev_note, sacc: 0, mode: 0}}]}
  # $12DF sidcall cascade: 0 fetches a row, $80+ is frozen, otherwise count down.
  cascade:
    - if: "cnt == 0"
      then:
        - set: {cur: row}
        - set: {cnt: "sidtab[cur].dl", row: "sidtab[cur].next"}
        - run: {record: sidtab, index: cur, field: do}
      else:
        - {if: "cnt < 0x80", then: [{set: {cnt: "cnt - 1"}}]}
  layer_a:
    - {call: cascade, with: {row: rowA, cnt: cntA}}
    - set: {rowA: row, cntA: cnt}
  layer_b:
    - {call: cascade, with: {row: rowB, cnt: cntB}}
    - set: {rowB: row, cntB: cnt}
  # $1405 pitch: no slide adds detune to the low byte only; $80+ integrates a
  # slide rate; $01-$7F adds one adjacent-semitone step. fc is the carry left
  # for the pulse sweep.
  pitch_acc:
    - if: "mode >= 0x80"
      then: [{accumulate: sacc, step: "(0 - rate(mode)) if mode & 0x40 else rate(mode)"}]
  pitch:
    - call: pitch_acc
    - if: "mode == 0"
      then:
        - set: {fc: "note_lo[note] + detune > 0xFF", flo: "note_lo[note] + detune", fhi: "note_hi[note]"}
      else:
        - if: "mode >= 0x80"
          then:
            - set: {pf: "sacc + nfreq(note)"}
          else:
            - set: {pf: "nfreq(note) + por((note + mode) & 0xFF)"}
        - set: {fc: "pf > 0xFFFF", flo: pf, fhi: "pf >> 8"}
  # $1495 pulse sweep: bit 7 adds, else subtracts with the pitch carry; at the
  # $0F high-byte ceiling or a zero high byte it pins and reverses.
  pulse:
    - {if: "ps == 0", then: [{return: true}]}
    - if: "ps >= 0x80"
      then:
        - accumulate: pw
          step: "ps & 0x7F"
          max: "0x0FFF if (pw >> 8) == 0x0F else 0xFFFF"
          clamp: false
          on_bound: [{set: {pw: 0x0FF8, ps: "ps ^ 0x80"}}]
      else:
        - accumulate: pw
          step: "0 - ps - (1 - fc)"
          max: "0x00FF if (pw >> 8) == 0 else 0xFFFF"
          clamp: false
          on_bound: [{set: {pw: 1, ps: "ps ^ 0x80"}}]
  play:
    - for_voices: [{call: latch}]
    - set: {o17: res, o18: "fv | 0x0F"}
    - call: acid_step
    - call: acid_out
    - for_voices: [{call: pattern}]
    - for_voices: [{call: layer_a}]
    - for_voices: [{call: layer_b}]
    - for_voices: [{call: pitch}, {call: pulse}]

init:
  - set: {vi: 0}
  - for_voices:
      - set: {detune: vi, rbit: "1 << vi", rmask: "0xFF ^ (1 << vi)"}
      - set:
          pw: "vinit[vi].pw"
          flo: "vinit[vi].flo"
          fhi: "vinit[vi].fhi"
          ad: "vinit[vi].ad"
          sr: "vinit[vi].sr"
          ctrl: "vinit[vi].ctrl"
          eor: "vinit[vi].wgl"
          mode: "vinit[vi].af"
          sacc: "vinit[vi].sacc"
          ps: "vinit[vi].ps"
          note: "vinit[vi].note"
          tbase: "vinit[vi].tbase"
          rowA: "vinit[vi].rowA"
          cntA: "vinit[vi].cntA"
          rowB: "vinit[vi].rowB"
          cntB: "vinit[vi].cntB"
      - set: {vi: "vi + 1"}
  - set:
      res: "ginit[0].resfilt"
      fv: "ginit[0].fv"
      cp: "ginit[0].cp"
      acc: "ginit[0].acc"
      astep: "ginit[0].astep"
      sub: "ginit[0].sub"
  - call: play

tick:
  - call: play

ghost:
  global: {0x16: o16, 0x17: o17, 0x18: o18}
  voice:
    0: o_flo
    1: o_fhi
    2: "o_pw & 0xFF"
    3: "(o_pw >> 8) & 0x0F"
    4: o_ctrl
    5: o_ad
    6: o_sr

# The modulators (see goattracker2.yaml); a start counts only when the new program sets one of
# the unit's program fields.
modulators:
  freq: {hi: note_hi, lo: note_lo}
  notes: [note, tbase]
  units:
    - name: pitch A
      key: freq
      cell: sacc
      fire: [layer_a, pitch_acc]
      pre: procs.layer_a
      post: procs.pitch_acc
      label: [rowA]
      x: "sidtab[rowA].xf"
      program: {pointer: rowA, record: sidtab, fields: [af, xf]}
      site:
        record: sidtab
        index: rowA
        field: xf
        clear: {af: "-1 if af >= 0x80 else af"}
        first: {af: 0x80}
      hooks: [{at: procs.pattern, written: [sacc], pointer: [rowA]}]
    - name: pulse A
      key: pw
      cell: pw
      chip: {width: 12, value: "pw & 0xFFF", store: {pw: value}}
      fire: [layer_a, pulse]
      pre: procs.layer_a
      post: procs.pulse
      label: [rowA]
      x: "sidtab[rowA].xp"
      program: {pointer: rowA, record: sidtab, fields: [pw, ps, xp]}
      site: {record: sidtab, index: rowA, field: xp, clear: {pw: -1, ps: -1}}
      hooks: [{at: procs.pattern, pointer: [rowA]}]
    - name: acid B
      scope: global
      key: cut
      cell: acc
      chip:
        width: 11
        value: "(floor if ((((acc & 0xFFFF) >> 8) + cp + (acc >= 0x10000)) >= 0x80 or (((acc & 0xFFFF) >> 8) + cp + (acc >= 0x10000)) < floor) else (((acc & 0xFFFF) >> 8) + cp + (acc >= 0x10000))) << dbl << 3"
        store: {acc: "((value >> 3 >> dbl) - cp) << 8"}
      fire: [layer_b, acid_step]
      pre: procs.layer_b
      post: procs.acid_step
      label: [rowB]
      x: "sidtab[rowB].xc"
      program: {pointer: rowB, record: sidtab, fields: [acid, xc]}
      site: {record: sidtab, index: rowB, field: xc, clear: {acid: -1}}
      hooks: [{at: procs.pattern, pointer: [rowB]}]
