  rate_lo: [0, 0, 1, 1, 2, 2, 4, 4, 8, 8, 12, 12, 17, 18, 20, 21, 22, 23, 25, 26, 28, 29, 31, 33, 35, 37, 39, 41, 44, 46, 49, 52, 55, 59, 62, 66, 70, 74, 78, 83, 88, 93, 98, 104, 110, 117, 124, 131, 139, 147, 156, 166, 175, 186, 197, 209, 221, 234, 248, 7, 22, 39, 57, 75, 95, 116, 138, 161, 186, 212, 240, 14, 45, 78, 113, 150, 190, 231, 20, 66, 116, 169, 224, 27, 90, 156, 226, 45, 123, 207, 39, 133, 232, 81, 193, 55, 180, 56, 196, 89, 247, 157, 78, 10, 208, 162, 129, 109, 103, 112, 137, 178, 237, 59, 156, 19, 160, 69, 2, 218, 206, 224, 17, 100, 218, 118, 57, 38]
