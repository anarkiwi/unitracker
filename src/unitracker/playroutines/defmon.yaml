# A pattern event's instrument column arms sidcall layer A with a sidTAB program and its command
# arms layer B; a document writes the pair as one ins record (see format/events/instrument.py),
# with the note's restart: its lookahead rows as one sidTAB program on layer B (command 1), as many
# ticks before the note as they hold.
instrument: {type: sidtab, base: 1, event: {type: ins, column: ctrl, commands: {1: filter}, restart: 1}}
note_offset: 24
# The pattern event's command arms layer B: the instrument's filter, or its restart.
commands:
  1: {ref: sidtab}
record_types:
  # The instrument an event names: the sidTAB programs it arms, ctrl on layer A and filter on
  # layer B, whose ACID step drives the cutoff (-1 leaves the layer running), and the note's
  # restart.
  ins:
    max: 0xFFFF
    form: map
    optional: [ctrl, filter, restart]
    refs: {ctrl: sidtab, filter: sidtab, restart: restart}
  # The restart a note names: lookahead rows of sidTAB columns, then the note's empty row.
  restart:
    form: map
    fields: [dl, next]
    optional: [wgh, wgl, ad, sr]
    codec:
      - when: "not last and dl >= 0 and dl < 0x80 and (wgh < 0 or (wgh & 1) == 0)"
        keys:
          hold: "dl + 1"
          ctrl: {value: "wgh | 1", omit: "wgh < 0", eor: {value: "wgl & 0xFE", omit: "wgl < 0 or (wgl & 0xFE) == 0"}}
          gate: {value: "wgl & 1", omit: "wgl < 0"}
        raw:
          dl: "hold - 1"
          wgh: "(ctrl & 0xFE) if has_ctrl else -1"
          wgl: "((eor if has_eor else 0) | (gate & 1)) if has_gate else -1"
      - when: "last and dl == 0 and wgh < 0 and wgl < 0 and ad < 0 and sr < 0"
  # sidTAB row: dl holds the row dl + 1 ticks ($80+ freezes the layer); each column, -1 when
  # absent, applies in the replay's bitmap-walk order ($16B0).
  sidtab:
    writes_as: ctrl
    # Every index is a row: an event's instrument 1 arms row 0.
    none: null
    stop: "dl >= 0x80"
    form: map
    # freq, pw and cut are the row's pitch, pulse and ACID modulator expressions (xf, xp, xc):
    # a pitch expression runs the slide mode (af $80), a pw expression replaces the pw and ps
    # columns and a cut expression the cp and acid columns; af below $80, a fixed offset, is a
    # pitch expression too. re edits $D417 for the row's voice: 0 unroutes it (route -), bit 3
    # keeps the routing and adds the voice and the low nibble under resonance re >> 4
    # (route + m), any other value is the byte (res, route).
    codec:
      - when: "(af == 0x80 if xf else af < 0) and pw < 0 and ps < 0 and cp < 0 and acid < 0 and (wgh < 0 or (wgh & 1) == 0)"
        keys:
          hold: {value: "dl + 1", omit: "dl == 0 or dl >= 0x80"}
          ctrl: {value: "wgh | 1", omit: "wgh < 0", eor: {value: "wgl & 0xFE", omit: "wgl < 0 or (wgl & 0xFE) == 0"}}
          gate: {value: "wgl & 1", omit: "wgl < 0"}
          note: {byte: tr, none: -1}
          freq: {expr: xf}
          pw: {expr: xp}
          cut: {expr: xc}
          res: {value: "re >> 4", omit: "re <= 0"}
          route: {value: "re & 0x0F", rel: "-1 if re == 0 else (1 if re & 0x08 else 0)", omit: "re < 0"}
          mode: {value: "fv & 0xF0", omit: "fv < 0"}
        raw:
          dl: "hold - 1"
          wgh: "(ctrl & 0xFE) if has_ctrl else -1"
          wgl: "((eor if has_eor else 0) | (gate & 1)) if has_gate else -1"
          af: "0x80 if xf else -1"
          re: "-1 if not has_route else (0 if route_rel < 0 else ((res & 0x0F) << 4) | (route & 0x0F))"
          fv: "mode if has_mode else -1"
    # A frozen row ends a program.
    end: {dl: 0x80}
    fields: [dl, next, xf, xp, xc]
    optional: [wgh, wgl, ad, sr, tr, af, pw, ps, re, fv, cp, acid]
    refs: {xf: x, xp: x, xc: x}
    do:
      - {if: "row.wgh >= 0", then: [{set: {ctrl: row.wgh}}]}
      - {if: "row.wgl >= 0", then: [{set: {eor: row.wgl}}]}
      - {if: "row.ad >= 0", then: [{set: {ad: row.ad}}]}
      - {if: "row.sr >= 0", then: [{set: {sr: row.sr}}]}
      - if: "row.tr >= 0"
        then: [{set: {note: "(row.tr & 0x7F) if row.tr & 0x80 else ((tbase + row.tr) & 0x7F)"}}]
      - {if: "row.af >= 0", then: [{set: {mode: row.af}}]}
      - {if: "row.pw >= 0", then: [{set: {pw: "(row.pw << 8) | (row.pw & 0xF0)"}}]}
      - {if: "row.ps >= 0", then: [{set: {ps: row.ps}}]}
      - if: "row.re >= 0"
        then:
          - set:
              res: "(res & rmask) if row.re == 0 else (((res & 0x0F) | row.re | rbit) if row.re & 0x08 else row.re)"
      - {if: "row.fv >= 0", then: [{set: {fv: row.fv}}]}
      - if: "row.cp >= 0"
        then: [{set: {acc: "((acc >= 0x10000) << 16) + ((acc + (row.cp - cp) * 256) & 0xFFFF)", cp: row.cp}}]
      - if: "row.acid >= 0"
        then:
          - if: "row.acid & 0x8000"
            then:
              - if: "row.acid & 0x4000"
                then: [{set: {astep: "row.acid & 0x3FFF", sub: 1}}]
                else: [{set: {astep: "row.acid & 0x7FFF", sub: 0}}]
            else: [{set: {acc: "(row.acid + cp * 256) & 0xFFFF", astep: 0}}]
  # Each voice's state the module carries through init ($1522 sets the other cells): its pulse
  # cell, the pitch unit's start value (the slide accumulator, an offset from the note's
  # frequency), and the note relative rows add to.
  vinit:
    fixed: true
    form: map
    fields: [pw, sacc, tbase]
    codec:
      - keys:
          # The written width is the 12-bit cell; a cell over $0FFF has no form that reads back.
          pw: {value: "pw if pw <= 0x0FFF else pw + 0x10000", omit: "pw == 0"}
          note: {value: tbase, abs: "1", omit: "tbase == 0"}
          freq: {value: "s16(sacc)", omit: "sacc == 0"}
        raw:
          pw: "pw if has_pw else 0"
          tbase: "note if has_note else 0"
          sacc: "(freq & 0xFFFF) if has_freq else 0"
  # The global state the module carries through init: the ACID step's direction ($10B8), sub 1
  # stepping the accumulator down (SBC), 0 up (ADC), and xc, the ACID unit's expression from init.
  # Init clears the filter registers and the accumulator.
  ginit:
    fixed: true
    form: map
    fields: [sub, xc]
    refs: {xc: x}
    codec:
      - when: "sub == 0"
        keys:
          cut: {expr: xc}
functions:
  nfreq:
    args: [n]
    expr: "note_lo[n] | (note_hi[n] << 8)"
  rate:
    args: [m]
    expr: "rate_lo[(m & 0x3F) << 1] | (rate_hi[(m & 0x3F) << 1] << 8)"
  por:
    args: [y]
    expr: "((por_lo[y + 1] | (por_hi[y + 1] << 8)) - (por_lo[y] | (por_hi[y] << 8))) & 0xFFFF"
global:
  res: {width: 8}
  fv: {width: 8}
  cp: {width: 8}
  acc: {width: 17}
  astep: {width: 16}
  sub: {width: 1}
  cf: {width: 8}
  o17: {width: 8}
  o18: {width: 8}
  vi: {width: 8}
voice:
  onset: {width: 1}
  pw: {width: 16}
  flo: {width: 8}
  fhi: {width: 8}
  ad: {width: 8}
  sr: {width: 8}
  ctrl: {width: 8}
  eor: {width: 8}
  mode: {width: 8}
  sacc: {width: 16}
  ps: {width: 8}
  note: {width: 8}
  tbase: {width: 8}
  rowA: {width: 8}
  cntA: {width: 8}
  rowB: {width: 8}
  cntB: {width: 8}
  row: {width: 8}
  cnt: {width: 8}
  cur: {width: 8}
  fc: {width: 1}
  pf: {}
  detune: {width: 8}
  rbit: {width: 8}
  rmask: {width: 8}
  o_flo: {width: 8}
  o_fhi: {width: 8}
  o_pw: {width: 16}
  o_ctrl: {width: 8}
  o_ad: {width: 8}
  o_sr: {width: 8}

procs:
  # $1022 SID band: this call writes the state the previous call left.
  latch:
    - set: {o_flo: flo, o_fhi: fhi, o_pw: pw, o_ctrl: "ctrl ^ eor", o_ad: ad, o_sr: sr}
  # $10B5 ACID accumulator. acc holds it with the offset cp added to its high byte, wrapped to
  # 16 bits; bit 16 is the carry of the last step. CLC then ADC adds the step, or SBC adds its
  # complement (step + 1 less), to the accumulator without the offset; a negative high byte
  # saturates to the floor.
  acid_step:
    - set: {acc: "((acc - cp * 256) & 0xFFFF) + ((0xFFFF - astep) if sub else astep)"}
    - if: "(acc & 0xFFFF) > 0x7FFF"
      then: [{set: {acc: "((acc >= 0x10000) << 16) + (floor << 8) + (acc & 0xFF)"}}]
    - {if: cp, then: [{set: {acc: "((acc >= 0x10000) << 16) + ((acc + cp * 256) & 0xFFFF)"}}]}
  # $10CA the cutoff byte: the high byte, which holds the offset, plus the carry, wrapped to 8 bits.
  acid_out:
    - set: {cf: "(acc >> 8) + (acc >> 16)"}
  # $117F pattern event: arm the sidcall layers, latch a note.
  pattern:
    - fetch: true
    - {if: ev_instr, then: [{set: {rowA: "ev_instr - 1", cntA: 0}}]}
    - {if: ev_cmd, then: [{set: {rowB: ev_arg, cntB: 0}}]}
    - {if: "ev_kind == 1", then: [{set: {onset: 1, tbase: ev_note, note: ev_note, sacc: 0, mode: 0}}]}
  # $12DF sidcall cascade: 0 fetches a row, $80+ is frozen, otherwise count down.
  cascade:
    - if: "cnt == 0"
      then:
        - set: {cur: row}
        - set: {cnt: "sidtab[cur].dl", row: "sidtab[cur].next"}
        - run: {record: sidtab, index: cur, template: do}
      else:
        - {if: "cnt < 0x80", then: [{set: {cnt: "cnt - 1"}}]}
  layer_a:
    - {call: cascade, with: {row: rowA, cnt: cntA}}
    - set: {rowA: row, cntA: cnt}
  layer_b:
    - {call: cascade, with: {row: rowB, cnt: cntB}}
    - set: {rowB: row, cntB: cnt}
  # $1405 pitch: no slide adds detune to the low byte only; $80+ integrates a
  # slide rate; $01-$7F adds one adjacent-semitone step. fc is the carry left
  # for the pulse sweep.
  pitch_acc:
    - if: "mode >= 0x80"
      then: [{accumulate: sacc, step: "(0 - rate(mode)) if mode & 0x40 else rate(mode)"}]
  pitch:
    - call: pitch_acc
    - if: "mode == 0"
      then:
        - set: {fc: "note_lo[note] + detune > 0xFF", flo: "note_lo[note] + detune", fhi: "note_hi[note]"}
      else:
        - if: "mode >= 0x80"
          then:
            - set: {pf: "sacc + nfreq(note)"}
          else:
            - set: {pf: "nfreq(note) + por((note + mode) & 0xFF)"}
        - set: {fc: "pf > 0xFFFF", flo: pf, fhi: "pf >> 8"}
  # $1495 pulse sweep: bit 7 adds, else subtracts with the pitch carry; at the
  # $0F high-byte ceiling or a zero high byte it pins and reverses.
  pulse:
    - {if: "ps == 0", then: [{return: true}]}
    - if: "ps >= 0x80"
      then:
        - accumulate: pw
          step: "ps & 0x7F"
          max: "0x0FFF if (pw >> 8) == 0x0F else 0xFFFF"
          clamp: false
          on_bound: [{set: {pw: 0x0FF8, ps: "ps ^ 0x80"}}]
      else:
        - accumulate: pw
          step: "0 - ps - (1 - fc)"
          max: "0x00FF if (pw >> 8) == 0 else 0xFFFF"
          clamp: false
          on_bound: [{set: {pw: 1, ps: "ps ^ 0x80"}}]
  play:
    - for_voices: [{call: latch}]
    - set: {o17: res, o18: "fv | 0x0F"}
    - call: acid_step
    - call: acid_out
    - for_voices: [{call: pattern}]
    - for_voices: [{call: layer_a}]
    - for_voices: [{call: layer_b}]
    - for_voices: [{call: pitch}, {call: pulse}]

init:
  - set: {vi: 0}
  - for_voices:
      - set: {detune: vi, rbit: "1 << vi", rmask: "0xFF ^ (1 << vi)"}
      # $1522: the envelope, control, pitch mode, pulse step, note and layer rows are 0 and both
      # layers frozen; the module carries the rest.
      - set:
          pw: "vinit[vi].pw"
          sacc: "vinit[vi].sacc"
          tbase: "vinit[vi].tbase"
          cntA: 0xFF
          cntB: 0xFF
      - set: {vi: "vi + 1"}
  - set: {sub: "ginit[0].sub"}
  - call: play

tick:
  - call: play

ghost:
  global: {0x16: "(floor if cf >= 0x80 or cf < floor else cf) << dbl", 0x17: o17, 0x18: o18}
  voice:
    0: "o_fhi:o_flo"
    2: "o_pw & 0xFF"
    3: "(o_pw >> 8) & 0x0F"
    4: o_ctrl
    5: o_ad
    6: o_sr

# The modulators (see goattracker2.yaml); a start counts only when the new program sets one of
# the unit's program fields.
modulators:
  freq: nfreq
  notes: [note, tbase]
  # S[k]: the offset af below $80 adds to note k - af.
  tables:
    S: {function: por, size: 256}
  units:
    # The offset the pitch adds to the note: the slide accumulator, or af below $80's offset.
    - name: pitch A
      key: freq
      cell: sacc
      chip: {width: 16, value: "sacc if mode >= 0x80 or mode == 0 else por((note + mode) & 0xFF)", store: {sacc: value}}
      fire: [layer_a, pitch_acc]
      program: {fields: [af, xf]}
      site:
        record: sidtab
        index: rowA
        field: xf
        clear: {af: -1}
        first: {af: 0x80}
      hooks: [{at: {proc: pattern}, written: [sacc], pointer: [rowA]}]
    - name: pulse A
      key: pw
      cell: pw
      chip: {width: 12}
      fire: [layer_a, pulse]
      program: {fields: [pw, ps, xp]}
      site: {record: sidtab, index: rowA, field: xp, clear: {pw: -1, ps: -1}}
    - name: acid B
      key: cut
      cell: acc
      fire: [layer_b, acid_step]
      program: {fields: [cp, acid, xc]}
      site: {record: sidtab, index: rowB, field: xc, clear: {cp: -1, acid: -1}}
      init: {record: ginit, index: 0, field: xc, clear: {sub: 0}}
