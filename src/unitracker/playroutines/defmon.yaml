instrument: {type: prog, base: 1}
lanes:
  voice: {pw: {}, bend: {}}
  global: {cut: {scale: 256}}
carry: {freq: fc, cut: ac}
pitch:
  note: "nfreq(note)"
  semi: {args: [k], expr: "por((note + k) & 0xFF)"}
specs:
  pw: [from, up, down, dir, lo, at_lo, hi, at_hi]
  bend: [step]
  cut: [from, step, up, down, dir, hi, at_hi, width]
commands:
  layer2: {code: 1, arg: ref prog}
record_types:
  # A sidcall program row: the columns present, applied in the replay's bitmap-walk order.
  prog:
    prefix: t
    none: -1
    first: 0
    chain: next
    defaults: {hold: 1}
    keys:
      hold: int
      ctrl: int
      ctrlxor: int
      ad: int
      sr: int
      note: note
      bend: value off,live,spec
      pw: value set,off,spec
      resfilt: int
      filtvoice: int
      modevol: int
      cutbias: int
      cut: value spec
    rules:
      - {check: "hold >= 1 and hold <= 128", error: "hold is 1-128 ticks"}
      - {check: "not has(note) or (note >= -64 and note <= 63)", error: "relative notes are -64..63"}
      - {check: "not has(resfilt) or (resfilt != 0 and (resfilt & 8) == 0)", error: "resfilt is nonzero without bit 3; use filtvoice"}
      - {check: "not has(filtvoice) or filtvoice == 0 or (filtvoice & 8) != 0", error: "filtvoice is 0 or has bit 3 set"}
      - {check: "not has(modevol) or (modevol & 0x0F) == 0x0F", error: "volume is always 15"}
      - {check: "isspec(pw) or not has(pw) or ((pw & 0xFF) == 0 and pw < 0x1000)", error: "pw is a multiple of 256 below 4096"}
    do:
      - {if: "has(row.ctrl)", then: [{set: {ctrl: row.ctrl}}]}
      - {if: "has(row.ctrlxor)", then: [{set: {eor: row.ctrlxor}}]}
      - {if: "has(row.ad)", then: [{set: {ad: row.ad}}]}
      - {if: "has(row.sr)", then: [{set: {sr: row.sr}}]}
      - {if: "has(row.note)", then: [{set: {note: "(tbase + row.note) & 0x7F"}}]}
      - {if: "has(row.noteabs)", then: [{set: {note: "row.noteabs & 0x7F"}}]}
      - {apply: {bend: row.bend}}
      - {apply: {pw: row.pw}}
      - {if: "has(row.resfilt)", then: [{set: {res: row.resfilt}}]}
      - if: "has(row.filtvoice)"
        then:
          - set: {res: "(res & rmask) if row.filtvoice == 0 else ((res & 0x0F) | row.filtvoice | rbit)"}
      - {if: "has(row.modevol)", then: [{set: {fv: row.modevol}}]}
      - {if: "has(row.cutbias)", then: [{set: {cp: row.cutbias}}]}
      - {apply: {cut: row.cut}}
  # Each voice's state as init leaves it.
  voiceinit:
    fixed: true
    keys:
      pw: value set,spec
      freq: int
      ad: int
      sr: int
      ctrl: int
      ctrlxor: int
      bend: value set,live,spec
      note: abs
      notebase: abs
      layer1: ref prog
      layer1wait: int
      layer2: ref prog
      layer2wait: int
    init:
      - {apply: {pw: row.pw}}
      - {if: "has(row.freq)", then: [{set: {flo: "row.freq & 0xFF", fhi: "row.freq >> 8"}}]}
      - {if: "has(row.ad)", then: [{set: {ad: row.ad}}]}
      - {if: "has(row.sr)", then: [{set: {sr: row.sr}}]}
      - {if: "has(row.ctrl)", then: [{set: {ctrl: row.ctrl}}]}
      - {if: "has(row.ctrlxor)", then: [{set: {eor: row.ctrlxor}}]}
      - {apply: {bend: row.bend}}
      - {if: "has(row.note)", then: [{set: {note: row.note}}]}
      - {if: "has(row.notebase)", then: [{set: {tbase: row.notebase}}]}
      - {if: "has(row.layer1)", then: [{set: {rowA: row.layer1, cntA: row.layer1wait}}]}
      - {if: "has(row.layer2)", then: [{set: {rowB: row.layer2, cntB: row.layer2wait}}]}
  globalinit:
    fixed: true
    keys: {resfilt: int, modevol: int, cutbias: int, cut: value spec}
    init:
      - {if: "has(row.resfilt)", then: [{set: {res: row.resfilt}}]}
      - {if: "has(row.modevol)", then: [{set: {fv: row.modevol}}]}
      - {if: "has(row.cutbias)", then: [{set: {cp: row.cutbias}}]}
      - {apply: {cut: row.cut}}
functions:
  nfreq:
    args: [n]
    expr: "note_lo[n] | (note_hi[n] << 8)"
  por:
    args: [y]
    expr: "((por_lo[y + 1] | (por_hi[y + 1] << 8)) - (por_lo[y] | (por_hi[y] << 8))) & 0xFFFF"
global:
  res: {width: 8}
  fv: {width: 8}
  cp: {width: 8}
  cut: {width: 16}
  ac: {width: 1}
  cf: {width: 8}
  o16: {width: 8}
  o17: {width: 8}
  o18: {width: 8}
  vi: {width: 8}
voice:
  pw: {width: 16}
  bend: {width: 16}
  flo: {width: 8}
  fhi: {width: 8}
  ad: {width: 8}
  sr: {width: 8}
  ctrl: {width: 8}
  eor: {width: 8}
  note: {width: 8}
  tbase: {width: 8}
  rowA: {width: 8}
  cntA: {width: 8, init: 0x80}
  rowB: {width: 8}
  cntB: {width: 8, init: 0x80}
  row: {width: 8}
  cnt: {width: 8}
  cur: {width: 8}
  fc: {width: 1}
  pf: {}
  detune: {width: 8}
  rbit: {width: 8}
  rmask: {width: 8}
  o_flo: {width: 8}
  o_fhi: {width: 8}
  o_pw: {width: 16}
  o_ctrl: {width: 8}
  o_ad: {width: 8}
  o_sr: {width: 8}

procs:
  # $1022 SID band: this call writes the state the previous call left.
  latch:
    - set: {o_flo: flo, o_fhi: fhi, o_pw: pw, o_ctrl: "ctrl ^ eor", o_ad: ad, o_sr: sr}
  # $10B5 cutoff output: the cut lane's high byte, the bias and the lane's carry,
  # clamped to the floor and optionally doubled.
  acid:
    - advance: cut
    - set: {cf: "(cut >> 8) + cp + ac"}
    - set: {o16: "floor if (cf >= 0x80 or cf < floor) else cf"}
    - {if: dbl, then: [{set: {o16: "o16 << 1"}}]}
  # $117F pattern event: arm the sidcall layers, latch a note.
  pattern:
    - fetch: true
    - {if: ev_instr, then: [{set: {rowA: "ev_instr - 1", cntA: 0}}]}
    - {if: ev_cmd, then: [{set: {rowB: ev_arg, cntB: 0}}]}
    - if: "ev_kind == 1"
      then: [{set: {tbase: ev_note, note: ev_note, bend: 0}}, {stop: bend}]
  # $12DF sidcall cascade: 0 fetches a row, $80+ is frozen, otherwise count down.
  cascade:
    - if: "cnt == 0"
      then:
        - set: {cur: row}
        - set: {cnt: "0x80 if prog[cur].next < 0 else prog[cur].hold - 1", row: "prog[cur].next"}
        - run: {record: prog, index: cur, field: do}
      else:
        - {if: "cnt < 0x80", then: [{set: {cnt: "cnt - 1"}}]}
  layer_a:
    - {call: cascade, with: {row: rowA, cnt: cntA}}
    - set: {rowA: row, cntA: cnt}
  layer_b:
    - {call: cascade, with: {row: rowB, cnt: cntB}}
    - set: {rowB: row, cntB: cnt}
  # $1405 pitch: with no bend the detune adds to the low byte only; otherwise the bend
  # lane (a slide, or a live offset) adds to the note's frequency. fc is the carry.
  pitch:
    - if: "not on(bend)"
      then:
        - set: {fc: "note_lo[note] + detune > 0xFF", flo: "note_lo[note] + detune", fhi: "note_hi[note]"}
      else:
        - advance: bend
        - set: {pf: "nfreq(note) + bend"}
        - set: {fc: "pf > 0xFFFF", flo: pf, fhi: "pf >> 8"}
  play:
    - for_voices: [{call: latch}]
    - set: {o17: res, o18: "fv | 0x0F"}
    - call: acid
    - for_voices: [{call: pattern}]
    - for_voices: [{call: layer_a}]
    - for_voices: [{call: layer_b}]
    - for_voices: [{call: pitch}, {advance: pw}]

init:
  - set: {vi: 0}
  - for_voices:
      - set: {detune: vi, rbit: "1 << vi", rmask: "0xFF ^ (1 << vi)"}
      - run: {record: voiceinit, index: vi, field: init}
      - set: {vi: "vi + 1"}
  - run: {record: globalinit, index: 0, field: init}
  - call: play

tick:
  - call: play

ghost:
  global: {0x16: o16, 0x17: o17, 0x18: o18}
  voice:
    0: o_flo
    1: o_fhi
    2: "o_pw & 0xFF"
    3: "(o_pw >> 8) & 0x0F"
    4: o_ctrl
    5: o_ad
    6: o_sr
